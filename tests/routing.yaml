# Routing test cases, run with `npm run eval` (OpenCode).
#
# Each case sends `prompt` to `agent` and records the first routing action:
#   skill:<name>    the agent loaded a skill (skill tool or opening its SKILL.md)
#   task:<agent>    the agent delegated to a subagent
#   read:<path>     the agent opened a canonical workflow in commands/ or agents/
#   none            the agent answered without any of the above
# The case passes when that first action is listed in `expect`.
# `npm run check` verifies that every name here exists.

cases:
  # ---- Asurada (front door) ----
  - id: guide-quick-question
    agent: asurada
    prompt: "Elden Ring: where do I get the Mimic Tear spirit ash? Keep it spoiler-free."
    expect: [skill:game-guide-expert, task:game-guide]

  - id: ai-trends
    agent: asurada
    prompt: "What were the biggest AI model releases this past week? Just a quick roundup, no need to save."
    expect: [skill:ai-trend-tracker]

  - id: route-short-script
    agent: asurada
    prompt: "Write a Taglish YouTube Short script about Physint moving to Xbox."
    expect: [task:gaming-trend-scout, task:scriptwriter, task:ga-orchestrator]

  - id: route-blog-review
    agent: asurada
    prompt: "Draft a blog review of Clair Obscur: Expedition 33 from my notes: combat is excellent, the story drags in act 2, soundtrack is a 10/10."
    expect: [task:game-content-writer, task:ga-orchestrator]

  - id: route-content-plan
    agent: asurada
    prompt: "Plan the next two weeks of Game Ako content around the recent Xbox studio layoffs."
    expect: [task:ga-orchestrator, task:gaming-trend-scout, task:content-strategist]

  - id: route-youtube-packaging
    agent: asurada
    prompt: "I need a title, description, and tags for my GameAko Speaks! episode about the risk of funding creative games like Physint."
    expect: [task:scriptwriter, task:ga-orchestrator]

  - id: route-scaffold
    agent: asurada
    prompt: "I want to add a new domain to this workspace for my software engineering work, with a subagent that reviews pull requests. Set it up."
    expect: [read:commands/scaffold-workflow.md, skill:scaffold-workflow]

  - id: memory-remember
    agent: asurada
    prompt: "Remember that I prefer concise answers with sources."
    expect: [skill:memory-management, read:commands/memory.md]

  - id: memory-recall
    agent: asurada
    prompt: "What do you remember about my content preferences?"
    expect: [skill:memory-management, read:commands/memory.md]

  - id: route-adp-content
    agent: asurada
    prompt: "Draft a Taglish article for Agentic Developer PH about choosing a first web framework; target beginners and cite current claims."
    expect: [task:adp-orchestrator]

  - id: route-teaching
    agent: asurada
    prompt: "Help me plan a lesson on REST API design for my college computing students."
    expect: [task:prof-vahveh]

  - id: no-overtrigger
    agent: asurada
    prompt: "In two sentences, what is the difference between TCP and UDP?"
    expect: [none]

  # ---- GA-Orchestrator ----
  - id: ga-facebook-post
    agent: ga-orchestrator
    prompt: "Gawa ka ng Facebook post announcing na live na yung bagong GameAko Speaks! episode namin sa YouTube tungkol sa AAA budgets."
    expect: [task:social-post-writer]

  - id: ga-gacha-trends
    agent: ga-orchestrator
    prompt: "Ano ang mga bagong updates sa Genshin Impact at Honkai: Star Rail this month?"
    expect: [task:gaming-trend-scout]

  - id: ga-scout-first-news
    agent: ga-orchestrator
    prompt: "Write a blog news article about this week's biggest console gaming announcement."
    expect: [task:gaming-trend-scout]

  - id: ga-evergreen-script
    agent: ga-orchestrator
    prompt: "Write a 10-minute GameAko Speaks! commentary script on why players love turn-based JRPG combat. Evergreen topic, no news needed."
    expect: [task:scriptwriter]

  # ---- Prof. Vahveh ----
  - id: teach-lesson-plan
    agent: prof-vahveh
    prompt: "Plan a 90-minute lab session on REST API design for my second-year college computing students."
    expect: [skill:lesson-planning]

  - id: teach-materials
    agent: prof-vahveh
    prompt: "Create a 10-item quiz with an answer key on binary search trees for my data structures class."
    expect: [task:content-creator, skill:content-creation]

  - id: teach-assessment
    agent: prof-vahveh
    prompt: "Score this student answer against my rubric and give constructive feedback. Rubric: correct base case (40%), correct recursive step (40%), clarity (20%). Student answer: 'def fact(n): return 1 if n == 0 else n * fact(n - 1)'."
    expect: [skill:student-assessment]

  # ---- ADP Orchestrator ----
  - id: adp-content-draft
    agent: adp-orchestrator
    prompt: "Write a Taglish 60-second short-form script for beginner developers about Git branches."
    expect: [task:adp-content-creator]

  - id: adp-social-publish
    agent: adp-orchestrator
    prompt: "Publish this approved Agentic Developer PH post to the LinkedIn page I specified: [approved copy]."
    expect: [skill:adp-social-media-posting]

  # ---- Game Guide ----
  - id: guide-missables
    agent: game-guide
    prompt: "Persona 5 Royal: is there anything missable before the second palace? No story spoilers."
    expect: [skill:game-guide-expert]
